name: CI

permissions:
  contents: read

# Hosted validation/packaging uses the bundled CPU runtime, not CUDA extras.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    env:
      PAIROFCLEATS_EMBEDDINGS: stub
      PAIROFCLEATS_CACHE_ROOT: .ci-cache/pairofcleats
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-26.10.0-v2-${{ hashFiles('package-lock.json', 'patches/**/*.patch') }}

      - name: Install deps
        shell: bash
        run: |
          if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" != "true" ]; then
            npm run bootstrap:ci
          else
            node tools/setup/rebuild-native.js --verify
          fi

      - name: Dependency security
        run: npm audit --audit-level=low

      - name: Bootstrap and runtime contracts
        run: |
          node tests/ci/dependency-security-contract.test.js
          node tests/ci/duplicate-scanner-contract.test.js
          node tests/ci/workflow-contract.test.js
          node tests/ci/onnx-cpu-install-policy.test.js
          node tests/tooling/install/postinstall-patch-enforcement.test.js
          node tests/tooling/install/postinstall-rebuild-native.test.js
          node tests/tooling/install/postinstall-signal-exit.test.js

      - name: Lint
        run: npm run lint

      - name: Config budget
        run: npm run config:budget

      - name: Env usage guardrail
        run: npm run env:check

      - name: Generated surfaces freshness
        run: node tools/docs/generated-surfaces.js --check-freshness

      - name: Command surface audit
        run: node tools/ci/check-command-surface.js

      - name: Gate lane
        run: |
          node tests/run.js --lane gate --jobs 1 --timeout-ms 30000 --retries 0 --native-status-redo=false --junit .testLogs/junit-gate.xml --log-dir .testLogs

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts-gate
          path: |
            .testLogs/**
            .diagnostics/**
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0

  rust-tui:
    name: rust-tui
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node for protocol fixtures
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/pairofcleats-tui/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/pairofcleats-tui/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cargo fmt
        working-directory: crates/pairofcleats-tui
        run: cargo fmt --check

      - name: Cargo check
        working-directory: crates/pairofcleats-tui
        run: cargo check --locked

      - name: Cargo test
        working-directory: crates/pairofcleats-tui
        run: cargo test --locked

      - name: Cargo clippy
        working-directory: crates/pairofcleats-tui
        run: cargo clippy --locked -- -D warnings

  ubuntu:
    name: ubuntu
    runs-on: ubuntu-latest
    needs: gate
    env:
      PAIROFCLEATS_EMBEDDINGS: stub
      PAIROFCLEATS_CACHE_ROOT: .ci-cache/pairofcleats
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: npm

      - name: Restore PairOfCleats cache
        uses: actions/cache@v6
        with:
          path: |
            .ci-cache/pairofcleats/models
            .ci-cache/pairofcleats/dictionaries
          key: pairofcleats-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            pairofcleats-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            pairofcleats-cache-${{ runner.os }}-

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-26.10.0-v2-${{ hashFiles('package-lock.json', 'patches/**/*.patch') }}

      - name: Install deps and report versions
        shell: bash
        run: |
          node -e "require('fs').mkdirSync('.ci-cache/pairofcleats/models', { recursive: true }); require('fs').mkdirSync('.ci-cache/pairofcleats/dictionaries', { recursive: true });"
          if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" != "true" ]; then
            npm run bootstrap:ci
          else
            echo "node_modules cache hit; verifying native modules."
            if ! node tools/setup/rebuild-native.js --verify; then
              echo "native verification failed; running targeted repair:native."
              node tools/setup/rebuild-native.js --repair
            fi
          fi
          node -v
          npm -v

      - name: Setup qualified Go SDK
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false

      - name: Verify selected Go SDK
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { runCommand } from "./tools/shared/cli-utils.js";
          const env = { ...process.env, GOTOOLCHAIN: "local" };
          delete env.GOROOT;
          const result = runCommand("go", ["env", "-json", "GOVERSION", "GOROOT"], { env, stdio: "pipe", timeoutMs: 4000, maxOutputBytes: 16384 });
          assert.equal(result.status, 0, JSON.stringify(result));
          assert.equal(result.stderr, "");
          const sdk = JSON.parse(result.stdout);
          assert.equal(sdk.GOVERSION, "go1.27.3");
          assert.ok(path.isAbsolute(sdk.GOROOT));
          assert.ok(!/[\r\n]/u.test(sdk.GOROOT));
          fs.appendFileSync(process.env.GITHUB_ENV, "GOROOT=" + sdk.GOROOT + "\nGOTOOLCHAIN=local\n");
          fs.mkdirSync(".diagnostics", { recursive: true });
          fs.writeFileSync(".diagnostics/go-sdk.json", JSON.stringify({ ...sdk, node: process.version, platform: process.platform, arch: process.arch, qualification: "selected-sdk-executable" }, null, 2) + "\n");
          console.log(JSON.stringify(sdk));
          '

      - name: Install optional LSP tools (best effort)
        shell: bash
        run: |
          set +e
          node tools/tooling/install.js --scope cache --tools pyright,yaml-language-server,gopls,csharp-ls,solargraph,phpactor --json
          status=$?
          if [ $status -ne 0 ]; then
            echo "optional tooling install had non-fatal failures (continuing)."
          fi
          exit 0

      - name: Qualify real Go language server startup
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { createHash } from "node:crypto";
          import { getToolingConfig } from "./tools/shared/dict-utils.js";
          import { probeLspInitializeHandshake, resolveToolingCommandProfile } from "./src/index/tooling/command-resolver.js";
          const toolingConfig = getToolingConfig(process.cwd());
          const workspace = path.resolve(".diagnostics/gopls-workspace");
          fs.mkdirSync(workspace, { recursive: true });
          fs.writeFileSync(path.join(workspace, "go.mod"), "module example.com/poc-qualification\n\ngo 1.26.0\n");
          fs.writeFileSync(path.join(workspace, "answer.go"), "package qualification\n\nfunc Answer() int { return 42 }\n");
          const profile = resolveToolingCommandProfile({ providerId: "gopls", cmd: "gopls", args: ["serve"], repoRoot: process.cwd(), toolingConfig });
          assert.equal(profile.probe.ok, true, JSON.stringify(profile));
          const result = await probeLspInitializeHandshake({ providerId: "gopls", ...profile.resolved, cwd: workspace, toolingConfig, timeoutMs: 4000 });
          const binary = profile.probe.resolvedPath || profile.resolved.cmd;
          const receipt = { source: process.env.GITHUB_SHA, node: process.version, abi: process.versions.modules, platform: process.platform, arch: process.arch, command: binary, args: profile.resolved.args, binarySha256: createHash("sha256").update(fs.readFileSync(binary)).digest("hex"), sdk: JSON.parse(fs.readFileSync(".diagnostics/go-sdk.json", "utf8")), result, qualification: "initialize-and-shutdown" };
          fs.writeFileSync(".diagnostics/gopls-startup.json", JSON.stringify(receipt, null, 2) + "\n");
          console.log(JSON.stringify(result));
          assert.equal(result.ok, true, JSON.stringify(result));
          assert.equal(result.capabilities.documentSymbol, true);
          assert.equal(result.capabilities.definition, true);
          '

      - name: CI Suite
        run: |
          node tools/ci/run-suite.js --mode ci --skip-prechecks

      - name: Prune PairOfCleats cache
        if: always()
        shell: pwsh
        run: |
          $cacheRoot = node -e "const fs=require('fs');const payload=JSON.parse(fs.readFileSync('.diagnostics/cache-root.json','utf8'));process.stdout.write(payload.cacheRoot);"
          $env:PAIROFCLEATS_CACHE_ROOT = $cacheRoot
          node tools/index/cache-gc.js --apply --grace-days 3 --max-deletes 200 --repo .

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-artifacts-ubuntu
          path: |
            .diagnostics/serial-native-lifecycle.json
            .diagnostics/go-sdk.json
            .diagnostics/gopls-startup.json
            .diagnostics/serial-runtime-budgets.json
            .diagnostics/api-contracts.json
            .diagnostics/test-summary.json
            .diagnostics/test-timings.json
            .diagnostics/test-profile.json
            .diagnostics/coverage/**
            .testLogs/junit.xml
            .testLogs/**/*.log
            .testLogs/**/*.failure.json
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts-ubuntu
          path: |
            .testLogs/**
            .diagnostics/**
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0

  windows:
    name: windows
    runs-on: windows-latest
    needs: gate
    env:
      PAIROFCLEATS_EMBEDDINGS: stub
      PAIROFCLEATS_CACHE_ROOT: .ci-cache/pairofcleats
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: npm

      - name: Restore PairOfCleats cache
        uses: actions/cache@v6
        with:
          path: .ci-cache/pairofcleats
          key: pairofcleats-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            pairofcleats-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            pairofcleats-cache-${{ runner.os }}-

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-26.10.0-v2-${{ hashFiles('package-lock.json', 'patches/**/*.patch') }}

      - name: Install deps and report versions
        shell: pwsh
        run: |
          node -e "require('fs').mkdirSync('.ci-cache/pairofcleats/models', { recursive: true }); require('fs').mkdirSync('.ci-cache/pairofcleats/dictionaries', { recursive: true });"
          if ('${{ steps.node-modules-cache.outputs.cache-hit }}' -ne 'true') {
            npm run bootstrap:ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'node_modules cache hit; verifying native modules.'
            node tools/setup/rebuild-native.js --verify
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'native verification failed; running targeted repair:native.'
              node tools/setup/rebuild-native.js --repair
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          node -v
          npm -v

      - name: Setup qualified Go SDK
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false

