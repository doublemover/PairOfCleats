          const env = { ...process.env, GOTOOLCHAIN: "local" };
          delete env.GOROOT;
          const result = runCommand("go", ["env", "-json", "GOVERSION", "GOROOT"], { env, stdio: "pipe", timeoutMs: 4000, maxOutputBytes: 16384 });
          assert.equal(result.status, 0, JSON.stringify(result));
          assert.equal(result.stderr, "");
          const sdk = JSON.parse(result.stdout);
          assert.equal(sdk.GOVERSION, "go1.27.3");
          assert.ok(path.isAbsolute(sdk.GOROOT));
          assert.ok(!/[\r\n]/u.test(sdk.GOROOT));
          fs.appendFileSync(process.env.GITHUB_ENV, "GOROOT=" + sdk.GOROOT + "\nGOTOOLCHAIN=local\n");
          fs.mkdirSync(".diagnostics", { recursive: true });
          fs.writeFileSync(".diagnostics/go-sdk.json", JSON.stringify({ ...sdk, node: process.version, platform: process.platform, arch: process.arch, qualification: "selected-sdk-executable" }, null, 2) + "\n");
          console.log(JSON.stringify(sdk));
          '

      - name: Install optional LSP tools (best effort)
        shell: pwsh
        run: |
          node tools/tooling/install.js --scope cache --tools pyright,yaml-language-server,gopls,csharp-ls,solargraph,phpactor --json
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'optional tooling install had non-fatal failures (continuing).'
          }
          exit 0

      - name: Windows subprocess ownership
        run: |
          node tests/run.js --lane all --match '/^shared\/kill-tree\.windows$/' --match '/^shared\/kill-tree\.windows-orphan-descendant-fallback$/' --match '/^shared\/kill-tree-windows-snapshot$/' --match '/^shared\/subprocess\/sync-timeout-kills-child-tree$/' --match '/^shared\/locks\/windows-delete-pending$/' --jobs 1 --pairofcleats-threads 1 --timeout-ms 30000 --retries 0 --native-status-redo=false --report-file .diagnostics/windows-subprocess-ownership.json

      - name: Qualify real Go language server startup
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { createHash } from "node:crypto";
          import { getToolingConfig } from "./tools/shared/dict-utils.js";
          import { probeLspInitializeHandshake, resolveToolingCommandProfile } from "./src/index/tooling/command-resolver.js";
          const toolingConfig = getToolingConfig(process.cwd());
          const workspace = path.resolve(".diagnostics/gopls-workspace");
          fs.mkdirSync(workspace, { recursive: true });
          fs.writeFileSync(path.join(workspace, "go.mod"), "module example.com/poc-qualification\n\ngo 1.26.0\n");
          fs.writeFileSync(path.join(workspace, "answer.go"), "package qualification\n\nfunc Answer() int { return 42 }\n");
          const profile = resolveToolingCommandProfile({ providerId: "gopls", cmd: "gopls", args: ["serve"], repoRoot: process.cwd(), toolingConfig });
          assert.equal(profile.probe.ok, true, JSON.stringify(profile));
          const result = await probeLspInitializeHandshake({ providerId: "gopls", ...profile.resolved, cwd: workspace, toolingConfig, timeoutMs: 4000 });
          const binary = profile.probe.resolvedPath || profile.resolved.cmd;
          const receipt = { source: process.env.GITHUB_SHA, node: process.version, abi: process.versions.modules, platform: process.platform, arch: process.arch, command: binary, args: profile.resolved.args, binarySha256: createHash("sha256").update(fs.readFileSync(binary)).digest("hex"), sdk: JSON.parse(fs.readFileSync(".diagnostics/go-sdk.json", "utf8")), result, qualification: "initialize-and-shutdown" };
          fs.writeFileSync(".diagnostics/gopls-startup.json", JSON.stringify(receipt, null, 2) + "\n");
          console.log(JSON.stringify(result));
          assert.equal(result.ok, true, JSON.stringify(result));
          assert.equal(result.capabilities.documentSymbol, true);
          assert.equal(result.capabilities.definition, true);
          '

      - name: CI Suite
        run: |
          node tools/ci/run-suite.js --mode ci --skip-prechecks

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-artifacts-windows
          path: |
            .diagnostics/serial-native-lifecycle.json
            .diagnostics/go-sdk.json
            .diagnostics/gopls-startup.json
            .diagnostics/windows-subprocess-ownership.json
            .diagnostics/serial-runtime-budgets.json
            .diagnostics/api-contracts.json
            .diagnostics/test-summary.json
            .diagnostics/test-timings.json
            .diagnostics/test-profile.json
            .diagnostics/coverage/**
            .testLogs/junit.xml
            .testLogs/**/*.log
            .testLogs/**/*.failure.json
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts-windows
          path: |
            .testLogs/**
            .diagnostics/**
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0

  windows-authority:
    name: windows-authority
    runs-on: windows-latest
    needs: gate
    timeout-minutes: 20
    env:
      PAIROFCLEATS_EMBEDDINGS: stub
    steps:
      - name: Checkout qualification commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: npm

      - name: Verify qualification commit
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $expected) {
            throw "Expected checkout $expected; got $actual"
          }

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-26.10.0-v2-${{ hashFiles('package-lock.json', 'patches/**/*.patch') }}

      - name: Prepare and verify required dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .diagnostics/windows-authority -Force | Out-Null
          if ('${{ steps.node-modules-cache.outputs.cache-hit }}' -ne 'true') {
            npm run bootstrap:ci 2>&1 | Tee-Object -FilePath .diagnostics/windows-authority/bootstrap.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node tools/setup/rebuild-native.js --verify 2>&1 | Tee-Object -FilePath .diagnostics/windows-authority/native-verify.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -LiteralPath .diagnostics/windows-authority/native-verify.log -Pattern '(?i)warn|error') {
            throw 'Native verification emitted unexpected diagnostics.'
          }

      - name: Strict Windows authority cohort
        run: node tools/ci/run-windows-authority.js

      - name: Upload authority qualification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-authority-qualification
          path: |
            .diagnostics/windows-authority/**
            .testLogs/windows-authority/**
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

