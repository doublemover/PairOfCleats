          import path from "node:path";
          import { createHash } from "node:crypto";
          import { getToolingConfig } from "./tools/shared/dict-utils.js";
          import { probeLspInitializeHandshake, resolveToolingCommandProfile } from "./src/index/tooling/command-resolver.js";
          const toolingConfig = getToolingConfig(process.cwd());
          const workspace = path.resolve(".diagnostics/gopls-workspace");
          fs.mkdirSync(workspace, { recursive: true });
          fs.writeFileSync(path.join(workspace, "go.mod"), "module example.com/poc-qualification\n\ngo 1.26.0\n");
          fs.writeFileSync(path.join(workspace, "answer.go"), "package qualification\n\nfunc Answer() int { return 42 }\n");
          const profile = resolveToolingCommandProfile({ providerId: "gopls", cmd: "gopls", args: ["serve"], repoRoot: process.cwd(), toolingConfig });
          assert.equal(profile.probe.ok, true, JSON.stringify(profile));
          const result = await probeLspInitializeHandshake({ providerId: "gopls", ...profile.resolved, cwd: workspace, toolingConfig, timeoutMs: 4000 });
          const binary = profile.probe.resolvedPath || profile.resolved.cmd;
          const receipt = { source: process.env.GITHUB_SHA, node: process.version, abi: process.versions.modules, platform: process.platform, arch: process.arch, command: binary, args: profile.resolved.args, binarySha256: createHash("sha256").update(fs.readFileSync(binary)).digest("hex"), sdk: JSON.parse(fs.readFileSync(".diagnostics/go-sdk.json", "utf8")), result, qualification: "initialize-and-shutdown" };
          fs.writeFileSync(".diagnostics/gopls-startup.json", JSON.stringify(receipt, null, 2) + "\n");
          console.log(JSON.stringify(result));
          assert.equal(result.ok, true, JSON.stringify(result));
          assert.equal(result.capabilities.documentSymbol, true);
          assert.equal(result.capabilities.definition, true);
          '

      - name: CI Suite
        run: |
          node tools/ci/run-suite.js --mode ci --skip-prechecks

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-artifacts-macos
          path: |
            .diagnostics/serial-native-lifecycle.json
            .diagnostics/go-sdk.json
            .diagnostics/gopls-startup.json
            .diagnostics/serial-runtime-budgets.json
            .diagnostics/api-contracts.json
            .diagnostics/test-summary.json
            .diagnostics/test-timings.json
            .diagnostics/test-profile.json
            .diagnostics/coverage/**
            .testLogs/junit.xml
            .testLogs/**/*.log
            .testLogs/**/*.failure.json
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts-macos
          path: |
            .testLogs/**
            .diagnostics/**
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0
