      shell: bash
      if: runner.os == 'Linux' || runner.os == 'macOS'
    - name: Record PHPactor native platform limitation
      run: |
        node --input-type=module -e '
        import assert from "node:assert/strict";
        import fs from "node:fs";
        import { getToolingConfig } from "./tools/shared/dict-utils.js";
        import { getToolingRegistry } from "./tools/tooling/utils.js";
        const root = process.cwd();
        const support = getToolingRegistry(getToolingConfig(root).dir, root).find(tool => tool.id === "phpactor").install;
        assert.equal(support.platforms.includes(process.platform), false);
        const receipt = { source: process.env.GITHUB_SHA, platform: process.platform, status: "unsupported", reason: "unsupported_platform", requirement: support.platformRequirement, coverageOwner: "tooling/install/phpactor-platform-contract" };
        fs.mkdirSync(".diagnostics", { recursive: true });
        fs.writeFileSync(".diagnostics/phpactor-platform.json", JSON.stringify(receipt, null, 2) + "\n");
        console.log(JSON.stringify(receipt));
        '
      shell: pwsh
      if: runner.os == 'Windows'
