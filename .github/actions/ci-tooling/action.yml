name: Qualify platform tooling
description: Provision and qualify the original platform-specific SDKs and language servers for tooling only.
runs:
  using: composite
  steps:
    - name: Setup qualified PHP runtime
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
      with:
        php-version: 8.5.12
        extensions: posix, mbstring, openssl, tokenizer, phar, ctype, dom, fileinfo, iconv, xml, xmlreader, xmlwriter
        coverage: none
        tools: none
      if: runner.os == 'Linux' || runner.os == 'macOS'
    - name: Verify selected PHP runtime
      run: |
        node --input-type=module -e '
        import assert from "node:assert/strict";
        import fs from "node:fs";
        import path from "node:path";
        import { createHash } from "node:crypto";
        import { runCommand } from "./tools/shared/cli-utils.js";
        const code = "echo json_encode([\"version\"=>PHP_VERSION,\"binary\"=>PHP_BINARY,\"extensions\"=>get_loaded_extensions()]);";
        const result = runCommand("php", ["-r", code], { stdio: "pipe", timeoutMs: 4000, maxOutputBytes: 16384 });
        assert.equal(result.status, 0, JSON.stringify(result));
        assert.equal(result.stderr, "");
        const sdk = JSON.parse(result.stdout);
        assert.equal(sdk.version, "8.5.12");
        assert.ok(path.isAbsolute(sdk.binary));
        const extensions = sdk.extensions.map(name => name.toLowerCase());
        for (const name of ["posix", "mbstring", "openssl", "tokenizer", "phar", "ctype", "dom", "fileinfo", "iconv", "xml", "xmlreader", "xmlwriter"]) assert.ok(extensions.includes(name), name);
        const command = fs.realpathSync(sdk.binary);
        const receipt = { ...sdk, command, source: process.env.GITHUB_SHA, node: process.version, platform: process.platform, arch: process.arch, binarySha256: createHash("sha256").update(fs.readFileSync(command)).digest("hex") };
        fs.mkdirSync(".diagnostics", { recursive: true });
        fs.writeFileSync(".diagnostics/php-sdk.json", JSON.stringify(receipt, null, 2) + "\n");
        console.log(JSON.stringify(receipt));
        '
      shell: bash
      if: runner.os == 'Linux' || runner.os == 'macOS'
    - name: Provision pinned PHPactor for CI
      env:
        PAIROFCLEATS_DOWNLOAD_REDIRECT_ORIGINS: '["https://release-assets.githubusercontent.com"]'
      run: node tools/ci/provision-phpactor.js
      shell: bash
      if: runner.os == 'Linux' || runner.os == 'macOS'
    - name: Setup qualified .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/poc-dotnet-sdk
      with:
        dotnet-version: 10.0.403
    - name: Verify selected .NET SDK
      run: |
        node --input-type=module -e '
        import assert from "node:assert/strict";
        import fs from "node:fs";
        import path from "node:path";
        import { createHash } from "node:crypto";
        import { runCommand } from "./tools/shared/cli-utils.js";
        const root = process.env.DOTNET_ROOT;
        assert.ok(root && path.isAbsolute(root) && !/[\r\n]/u.test(root));
        const command = path.join(root, process.platform === "win32" ? "dotnet.exe" : "dotnet");
        const options = { stdio: "pipe", timeoutMs: 4000, maxOutputBytes: 16384 };
        const version = runCommand(command, ["--version"], options);
        const selected = runCommand("dotnet", ["--version"], options);
        const runtimes = runCommand(command, ["--list-runtimes"], options);
        for (const result of [version, selected, runtimes]) { assert.equal(result.status, 0, JSON.stringify(result)); assert.equal(result.stderr, ""); }
        assert.equal(version.stdout.trim(), "10.0.403");
        assert.equal(selected.stdout.trim(), "10.0.403");
        assert.match(runtimes.stdout, /^Microsoft\.NETCore\.App 10\.0\.14 \[/m);
        const archRoot = "DOTNET_ROOT_" + process.arch.toUpperCase();
        fs.appendFileSync(process.env.GITHUB_ENV, archRoot + "=" + root + "\nDOTNET_HOST_PATH=" + command + "\n");
        const receipt = { source: process.env.GITHUB_SHA, node: process.version, platform: process.platform, arch: process.arch, root, command, sdkVersion: version.stdout.trim(), runtimeOutput: runtimes.stdout, binarySha256: createHash("sha256").update(fs.readFileSync(command)).digest("hex") };
        fs.mkdirSync(".diagnostics", { recursive: true });
        fs.writeFileSync(".diagnostics/dotnet-sdk.json", JSON.stringify(receipt, null, 2) + "\n");
        console.log(JSON.stringify(receipt));
        '
      shell: bash
      if: runner.os == 'Linux' || runner.os == 'macOS'
    - name: Verify selected .NET SDK
      run: |
        node --input-type=module -e '
        import assert from "node:assert/strict";
        import fs from "node:fs";
        import path from "node:path";
        import { createHash } from "node:crypto";
        import { runCommand } from "./tools/shared/cli-utils.js";
        const root = process.env.DOTNET_ROOT;
        assert.ok(root && path.isAbsolute(root) && !/[\r\n]/u.test(root));
        const command = path.join(root, process.platform === "win32" ? "dotnet.exe" : "dotnet");
        const options = { stdio: "pipe", timeoutMs: 4000, maxOutputBytes: 16384 };
        const version = runCommand(command, ["--version"], options);
        const selected = runCommand("dotnet", ["--version"], options);
        const runtimes = runCommand(command, ["--list-runtimes"], options);
        for (const result of [version, selected, runtimes]) { assert.equal(result.status, 0, JSON.stringify(result)); assert.equal(result.stderr, ""); }
        assert.equal(version.stdout.trim(), "10.0.403");
        assert.equal(selected.stdout.trim(), "10.0.403");
        assert.match(runtimes.stdout, /^Microsoft\.NETCore\.App 10\.0\.14 \[/m);
        const archRoot = "DOTNET_ROOT_" + process.arch.toUpperCase();
        fs.appendFileSync(process.env.GITHUB_ENV, archRoot + "=" + root + "\nDOTNET_HOST_PATH=" + command + "\n");
        const receipt = { source: process.env.GITHUB_SHA, node: process.version, platform: process.platform, arch: process.arch, root, command, sdkVersion: version.stdout.trim(), runtimeOutput: runtimes.stdout, binarySha256: createHash("sha256").update(fs.readFileSync(command)).digest("hex") };
        fs.mkdirSync(".diagnostics", { recursive: true });
        fs.writeFileSync(".diagnostics/dotnet-sdk.json", JSON.stringify(receipt, null, 2) + "\n");
        console.log(JSON.stringify(receipt));
