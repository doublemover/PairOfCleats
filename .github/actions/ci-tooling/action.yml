        assert.equal(result.ok, true, JSON.stringify(receipt));
        assert.equal(receipt.commandRealpath, fs.realpathSync(provision.command));
        assert.equal(receipt.binarySha256, provision.binarySha256);
        assert.equal(receipt.result.capabilities.documentSymbol, true);
        assert.equal(receipt.result.capabilities.definition, true);
        '
      shell: pwsh
      if: runner.os == 'Windows'
    - name: Qualify real PHPactor startup
      env:
        PAIROFCLEATS_TRUSTED_REPOS: ${{ format('[{0},{1}]', toJSON(github.workspace), toJSON(format('{0}/.diagnostics/.lsp-qualification/phpactor', github.workspace))) }}
        XDG_CACHE_HOME: ${{ runner.temp }}/poc-phpactor-cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/poc-phpactor-config
        XDG_DATA_HOME: ${{ runner.temp }}/poc-phpactor-data
      run: |
        node --input-type=module -e '
        import assert from "node:assert/strict";
        import fs from "node:fs";
        import path from "node:path";
        import { getToolingConfig } from "./tools/shared/dict-utils.js";
        import { qualifyInstalledLspRuntime } from "./tools/ci/qualify-lsp-runtime.js";
        const provision = JSON.parse(fs.readFileSync(".diagnostics/phpactor-provisioning.json", "utf8"));
        const result = await qualifyInstalledLspRuntime({ providerId: "phpactor", repoRoot: process.cwd(), toolingConfig: { ...getToolingConfig(process.cwd()), dir: provision.toolingRoot }, diagnosticsDir: path.resolve(".diagnostics") });
        const receipt = { ...result.receipt, ok: result.ok, process: result.process, sdk: JSON.parse(fs.readFileSync(".diagnostics/php-sdk.json", "utf8")), qualification: "initialize-shutdown-clean-exit" };
        fs.writeFileSync(".diagnostics/phpactor-startup.json", JSON.stringify(receipt, null, 2) + "\n");
        console.log(JSON.stringify({ ok: result.ok, result: result.receipt?.result, process: result.process }));
        assert.equal(result.ok, true, JSON.stringify(receipt));
        assert.equal(receipt.commandRealpath, fs.realpathSync(provision.command));
