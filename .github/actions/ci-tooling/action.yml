        const receipt = { ...result.receipt, ok: result.ok, process: result.process, sdk: JSON.parse(fs.readFileSync(".diagnostics/dotnet-sdk.json", "utf8")), qualification: "initialize-shutdown-clean-exit" };
        fs.writeFileSync(".diagnostics/csharp-ls-startup.json", JSON.stringify(receipt, null, 2) + "\n");
